apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: berget-me-hpa
  namespace: berget-me
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: berget-me
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
