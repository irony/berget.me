apiVersion: apps/v1
kind: Deployment
metadata:
  name: berget-me
  namespace: berget-me
  labels:
    app: berget-me
spec:
  replicas: 2
  selector:
    matchLabels:
      app: berget-me
  template:
    metadata:
      labels:
        app: berget-me
    spec:
      containers:
      - name: berget-me
        image: ghcr.io/berget.me/berget-me:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
